<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen Sudoku - Mindful Puzzle Game</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #0f172a; color: #f8fafc; text-align: center; }
    .container { max-width: 600px; margin: 0 auto; padding: 48px 24px; }
    .logo { width: 120px; height: 120px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 24px; }
    h1 { font-size: 2.5rem; margin-bottom: 12px; }
    p { font-size: 1.1rem; color: #94a3b8; line-height: 1.6; }
    .btn { display: inline-block; background: #38bdf8; color: #0f172a; font-weight: bold; padding: 16px 32px; border-radius: 99px; text-decoration: none; margin-top: 24px; font-size: 1.1rem; }
    .links { margin-top: 48px; display: flex; justify-content: center; gap: 16px; }
    .links a { color: #38bdf8; text-decoration: none; font-size: 0.95rem; }
  </style>

  <div class="container">
    <img src="zen_logo.png" alt="Zen Sudoku Logo" class="logo" onerror="this.style.display='none'">

    <p>Train your brain with beautiful, relaxing classic Sudoku puzzles, custom themes, arcade mini-games, and mindful soundscapes.</p>
    <a href="https://play.google.com/store/apps/details?id=com.zensudoku.android" class="btn">Get it on Google Play</a>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
